name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Controllo sintassi Python
        run: python3 -m py_compile app/*.py create_consumer_key.py

      # Nessun download da Docker Hub (limiti sui pull anonimi dai runner GitHub):
      # si usa il builder Docker già presente sul runner e l'immagine base dal mirror AWS.
      # Solo linux/amd64, l'architettura di Unraid.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build e push
        run: |
          tags=$(echo "${{ steps.meta.outputs.tags }}" | sed 's/^/--tag /' | tr '\n' ' ')
          labels=$(echo "${{ steps.meta.outputs.labels }}" | sed 's/^\(.*\)$/--label "\1"/' | tr '\n' ' ')
          for i in 1 2 3; do
            eval docker build --pull --platform linux/amd64 $tags $labels . && break
            echo "Build fallita (tentativo $i), riprovo tra 20s"; sleep 20
            [ "$i" = 3 ] && exit 1
          done
          for t in $(echo "${{ steps.meta.outputs.tags }}"); do docker push "$t"; done
