services:
  ovh-ks-sniper:
    image: ghcr.io/land2595/storina:latest
    # Per compilare in locale invece di scaricare l'immagine: commenta "image" e usa "build: ."
    # build: .
    container_name: ovh-ks-sniper
    restart: unless-stopped
    env_file: .env
    ports:
      # Web UI: http://IP-UNRAID:8765
      - "8765:8765"
    volumes:
      # Su Unraid: lock, stato e log persistenti in appdata
      - /mnt/user/appdata/ovh-ks-sniper:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
